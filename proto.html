const BrewComments = {
  props: {
    initialComments: { type: Array, default: () => [] }
  },
  data() {
    return {
      comments: this.initialComments.map(c => ({ ...c })),
      text: ''
    };
  },
  methods: {
    add() {
      const t = this.text.trim();
      if (!t) return;
      this.comments.unshift({ text: t, date: new Date().toLocaleDateString('ru-RU') });
      this.text = '';
    }
  },
  template: `
    <div>
      <div v-if="comments.length === 0" class="hint" style="padding:6px 0 2px">Комментариев пока нет.</div>

const RecipeShowPage = {
  computed: {
    recipeId() { return Number(this.$route.params.id); },
    recipe() { return RECIPES.find(r => r.id === this.recipeId) || null; },
    detail() { return RECIPE_DETAILS[this.recipeId] || RECIPE_DETAILS[1]; },
    ingWord() { return this.recipe ? plural(this.recipe.ingredients, ['ингредиент', 'ингредиента', 'ингредиентов']) : ''; },
    brewWord() { return this.recipe ? plural(this.recipe.brews, ['варка', 'варки', 'варок']) : ''; },
    groups() {
      const map = new Map();
      for (const ing of this.detail.ingredients) {
        if (!map.has(ing.category)) map.set(ing.category, []);
        map.get(ing.category).push(ing);
      }
      const result = [];
      for (const cat of CATEGORY_ORDER) {
        if (map.has(cat)) {
          result.push({ category: cat, icon: CATEGORY_ICONS[cat] || '•', items: map.get(cat) });
          map.delete(cat);
        }
      }
      for (const [cat, items] of map) result.push({ category: cat, icon: '•', items });
      return result;
    }
  },
  methods: {
    brewNow() { alert('Варка по рецепту «' + this.recipe.name + '» запущена (демо)'); },
    brewModified() { alert('Открыта форма варки с изменениями рецепта (демо)'); }

        <div><h1>Создание рецепта</h1><p class="page-sub">Заполните параметры, ингредиенты и температурные паузы</p></div>
      </div>
      <recipe-form :initial="emptyInitial" mode="create"></recipe-form>
    </div>`
};

const RecipeEditPage = {
  data() {
    const detail = RECIPE_DETAILS[Number(this.$route.params.id)] || RECIPE_DETAILS[1];
    const recipe = RECIPES.find(r => r.id === Number(this.$route.params.id)) || RECIPES[0];
    return {
      recipeName: recipe.name,
      initial: {
        name: recipe.name,
        description: 'Проверенный рецепт с корректировками по результатам последних варок.',
        instructions: detail.instructions,
        ingredients: detail.ingredients.map(i => ({ category: i.category, name: i.name, qty: i.qty, time: i.time })),
        steps: detail.steps.map(s => ({ ...s }))
      }
    };
  },
  template: `
    <div class="stack">
      <div class="page-head">
        <div><h1>Редактирование рецепта</h1><p class="page-sub">{{ recipeName }}</p></div>
      </div>
      <recipe-form :initial="initial" mode="edit"></recipe-form>
    </div>`
};

const BrewsPage = {
  data() { return { rows: BREWS.map(b => ({ ...b })) }; },
  methods: {
    start() { alert('Выберите рецепт и параметры новой варки (демо)'); },
    remove(i) { this.rows.splice(i, 1); },
    fmt: fmtMoney
  },
  template: `
    <div class="stack">
      <div class="page-head">
        <div><h1>Варки</h1><p class="page-sub">История всех варок</p></div>
        <button class="btn btn-primary" @click="start">🔥 Начать варку</button>
      </div>
      <div class="card card-table">
        <table class="tbl">
          <thead>
            <tr>
              <th>Дата</th><th>Рецепт</th>
              <th class="num">Объём (л)</th>
              <th class="num">Себестоимость / л (₽)</th>
              <th style="width:150px">Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(b, i) in rows" :key="b.id">
              <td>{{ b.date }}</td>
              <td>
                <template v-if="b.modified">
                  <span class="badge badge-amber">⚠️ Модифицирована</span>
                  <div class="cell-sub">{{ b.recipe }}</div>
                </template>
                <template v-else>{{ b.recipe }}</template>
              </td>
              <td class="num">{{ b.volume }}</td>
              <td class="num">{{ fmt(b.costPerLiter) }}</td>
              <td>
                <div class="actions-cell">
                  <router-link class="btn btn-outline btn-sm" :to="'/brews/' + b.id">Открыть</router-link>
                  <button class="icon-btn danger" title="Удалить" @click="remove(i)">🗑️</button>
                </div>
              </td>
            </tr>
            <tr v-if="rows.length === 0"><td colspan="5" class="empty-row">Варок пока нет</td></tr>
          </tbody>
        </table>
      </div>
    </div>`
};

const BrewShowPage = {
  computed: {
    brew() { return BREWS.find(b => b.id === Number(this.$route.params.id)) || null; },
    consumed() { return BREW_CONSUMED; },
    comments() { return BREW_COMMENTS; },
    total() { return this.brew ? fmtMoney(this.brew.volume * this.brew.costPerLiter) : ''; }
  },
  methods: { fmt: fmtMoney },
  template: `
    <div class="stack" v-if="brew">
      <div class="page-head">
        <div>
          <h1>{{ brew.modified ? 'Модифицирована' : brew.recipe }}</h1>
          <p class="page-sub">Варка от {{ brew.date }} · рецепт: {{ brew.recipe }}</p>
        </div>
        <div v-if="brew.modified"><span class="badge badge-amber">⚠️ есть изменения</span></div>
      </div>

      <div class="card card-pad">
        <div class="info-grid">
          <div class="info-item"><div class="k">Рецепт</div><div class="v">{{ brew.recipe }}</div></div>
          <div class="info-item"><div class="k">Дата варки</div><div class="v">{{ brew.date }}</div></div>
          <div class="info-item"><div class="k">Объём</div><div class="v">{{ brew.volume }} л</div></div>
          <div class="info-item"><div class="k">Себестоимость</div><div class="v">{{ fmt(brew.costPerLiter) }} ₽/л</div></div>
          <div class="info-item"><div class="k">Общая стоимость</div><div class="v">{{ total }} ₽</div></div>
        </div>
      </div>

      <div v-if="brew.modified" class="card card-pad">
        <div class="section-title">🔀 Изменения</div>
        <p class="hint" style="margin-bottom:12px">В эту варку вносились изменения относительно исходного рецепта.</p>
        <brew-diff></brew-diff>
      </div>

      <div class="card card-table">
        <div class="table-head"><div class="section-title">📦 Списанные ингредиенты</div></div>
        <table class="tbl">
          <thead><tr><th>Ингредиент</th><th class="num">Количество</th><th class="num">Цена за единицу</th></tr></thead>
          <tbody>
            <tr v-for="c in consumed" :key="c.name">
              <td>{{ c.name }}</td>
              <td class="num">{{ c.qty }}</td>
              <td class="num">{{ c.price }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card card-pad">
        <div class="section-title">💬 Комментарии</div>
        <brew-comments :initial-comments="comments"></brew-comments>
      </div>
    </div>
    <div v-else class="card card-pad">Варка не найдена.</div>`
};

const SettingsPage = {
  template: `
    <div class="stack">
      <div class="page-head">
        <div><h1>Настройки</h1><p class="page-sub">Параметры расчёта себестоимости и работа с данными</p></div>
      </div>
      <settings-form></settings-form>
      <import-export></import-export>
    </div>`
};

/* ================= router & app ================= */

const router = createRouter({
  history: createWebHashHistory(),
  routes: [
    { path: '/', component: HomePage },
    { path: '/equipment', component: EquipmentPage },
    { path: '/stock', component: StockPage },
    { path: '/recipes', component: RecipesPage },
    { path: '/recipes/create', component: RecipeCreatePage },
    { path: '/recipes/:id', component: RecipeShowPage },
    { path: '/recipes/:id/edit', component: RecipeEditPage },
    { path: '/brews', component: BrewsPage },
    { path: '/brews/:id', component: BrewShowPage },
    { path: '/settings', component: SettingsPage },
    { path: '/:pathMatch(.*)*', redirect: '/' }
  ],
  scrollBehavior() { return { top: 0 }; }
});

const app = createApp({
  setup() {
    const nav = [
      { to: '/', icon: '🏠', label: 'Главная' },
      { to: '/equipment', icon: '📦', label: 'Оборудование' },
      { to: '/stock', icon: '📦', label: 'Склад' },
      { to: '/recipes', icon: '🍺', label: 'Рецепты' },
      { to: '/brews', icon: '🔥', label: 'Варки' },
      { to: '/settings', icon: '⚙️', label: 'Настройки' }
    ];
    return { nav };
  },
  template: `
    <div class="layout">
      <aside class="sidebar">
        <div class="brand"><span class="brand-ico">🍺</span><span>Моя пивоварня</span></div>
        <nav class="nav">
          <router-link
            v-for="item in nav"
            :key="item.to"
            :to="item.to"
            :active-class="item.to === '/' ? 'nav-static' : 'router-link-active'"
            exact-active-class="router-link-active">
            <span class="nav-icon">{{ item.icon }}</span>{{ item.label }}
          </router-link>
        </nav>
        <div class="sidebar-foot">Личный трекер пивоварения<br>Демо-версия без бэкенда</div>
      </aside>
      <main class="main">
        <router-view></router-view>
      </main>
    </div>`
});

app.use(router);
app.component('StockForecast', StockForecast);
app.component('StockBalance', StockBalance);
app.component('RecipeForm', RecipeForm);
app.component('BrewComments', BrewComments);
app.component('BrewDiff', BrewDiff);
app.component('SettingsForm', SettingsForm);
app.component('ImportExport', ImportExport);
app.mount('#app');
</script>
</body>
</html>
